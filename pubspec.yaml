name: deudas_app
description: "Deudas, cobros y gastos: la app nativa contra la misma API."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  # Lo justo. Nada de librerias de estado gigantes ni de UI de terceros: la
  # app es una lista, un formulario y un grafico, y Material ya los trae.
  http: ^1.2.2                  # las llamadas a la API
  shared_preferences: ^2.3.2    # el token de sesion, como el localStorage
  provider: ^6.1.2              # el estado, sin ceremonia
  intl: ^0.19.0                 # fechas y montos en español de Nicaragua
  image_picker: ^1.1.2          # la cámara y la galería, para el comprobante
  # La API solo acepta el comprobante en JPEG (es el único formato que se
  # puede incrustar tal cual en el PDF del estado de cuenta). Una captura de
  # pantalla es PNG, y ni la cámara ni la galería garantizan el formato, así
  # que se recodifica aquí antes de subirlo.
  image: ^4.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
